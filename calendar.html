<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="透明外圍、自動明暗模式的月曆，供 Notion 嵌入。">
  <title>月曆</title>
  <link rel="stylesheet" href="widgets.css">
</head>
<body data-widget="calendar">
  <main class="card calendar" aria-label="月曆">
    <header class="calendar-header">
      <button type="button" id="previous" aria-label="上個月">‹</button>
      <h1 id="month-title" aria-live="polite">月曆</h1>
      <button type="button" id="next" aria-label="下個月">›</button>
    </header>
    <div class="calendar-body">
      <table aria-labelledby="month-title">
        <thead><tr><th scope="col" abbr="Sunday">SUN</th><th scope="col" abbr="Monday">MON</th><th scope="col" abbr="Tuesday">TUE</th><th scope="col" abbr="Wednesday">WED</th><th scope="col" abbr="Thursday">THU</th><th scope="col" abbr="Friday">FRI</th><th scope="col" abbr="Saturday">SAT</th></tr></thead>
        <tbody id="calendar-days"></tbody>
      </table>
      <button type="button" id="today" class="today-button">回到今天</button>
    </div>
  </main>
  <noscript>請啟用 JavaScript 以顯示月曆。</noscript>
  <script type="module" src="widgets.mjs"></script>
</body>
</html>
